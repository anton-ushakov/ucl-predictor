spring.application.name=ucl-predictor
server.port=8081

# PostgreSQL. Пароль можно задать переменной окружения DB_PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5433/ucl_predictor
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Схему создаёт Flyway (src/main/resources/db/migration), Hibernate только проверяет её.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Время хранится в UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Количество недель, для которых отображаются будущие матчи
app.predictions.weeks-ahead=4

# Кто рассылает объявления всем участникам (имена через запятую).
# Задаётся переменной окружения ADMIN_USERNAMES, в коде не хранится.
app.admin.usernames=${ADMIN_USERNAMES:}

# Мгновенные оповещения через Firebase. Без ключа приложение забирает
# оповещения опросом, поэтому настройка необязательная.
app.push.credentials=${FIREBASE_CREDENTIALS:}
app.push.project-id=${FIREBASE_PROJECT_ID:}

# Папка, где сервер хранит выложенные apk. В docker-compose она на отдельном томе,
# поэтому файлы переживают пересборку образа.
app.releases.dir=${RELEASES_DIR:/app/releases}

# Загрузка apk через приложение: файл сборки заметно больше обычной формы
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB

# Второй источник матчей: api-sports.io (API-Football). Нужен ради турниров, которых нет
# в бесплатном тарифе football-data.org: Лига Европы, РПЛ, Лига наций.
# Бесплатный тариф — 100 запросов в сутки, поэтому расписание берём раз в несколько часов,
# а счёт идущих матчей — одним запросом на все турниры и только пока они идут.
app.api-football.key=${API_FOOTBALL_KEY:}
app.api-football.daily-limit=${API_FOOTBALL_DAILY_LIMIT:90}
app.api-football.fixtures-interval=PT6H
app.api-football.live-interval=PT10M
