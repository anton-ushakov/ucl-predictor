spring.application.name=ucl-predictor
server.port=8081

# PostgreSQL. Пароль можно задать переменной окружения DB_PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5433/ucl_predictor
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Схему создаёт Flyway (src/main/resources/db/migration), Hibernate только проверяет её.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Время хранится в UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Количество недель, для которых отображаются будущие матчи
app.predictions.weeks-ahead=4
